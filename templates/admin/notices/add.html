{% extends "layouts/base.html" %}

{% block title %}
Add Notice - AI Smart Attendance System
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-megaphone-fill me-2"></i>
                Add Notice
            </h3>

            <p class="text-muted mb-0">
                Create a new notice for students
            </p>
        </div>

        <a
            href="{{ url_for('admin_notice.index') }}"
            class="btn btn-outline-secondary"
        >
            <i class="bi bi-arrow-left me-1"></i>
            Back
        </a>

    </div>


    <div class="card border-0 shadow-sm">

        <div class="card-body p-4">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="row g-4">

                    <!-- TITLE -->

                    <div class="col-md-8">

                        <label class="form-label fw-semibold">
                            Notice Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="Enter notice title"
                            required
                        >

                    </div>


                    <!-- TYPE -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Notice Type
                        </label>

                        <select
                            name="notice_type"
                            class="form-select"
                        >

                            <option value="General">
                                General
                            </option>

                            <option value="Exam">
                                Exam
                            </option>

                            <option value="Result">
                                Result
                            </option>

                            <option value="Important">
                                Important
                            </option>

                            <option value="Holiday">
                                Holiday
                            </option>

                            <option value="Event">
                                Event
                            </option>

                        </select>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="col-12">

                        <label class="form-label fw-semibold">
                            Notice Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="6"
                            placeholder="Write notice details here..."
                        ></textarea>

                    </div>


                    <!-- SEMESTER -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Target Semester
                        </label>

                        <select
                            name="target_semester"
                            class="form-select"
                        >

                            <option value="">
                                All Semesters
                            </option>

                            <option value="1st">
                                1st Semester
                            </option>

                            <option value="2nd">
                                2nd Semester
                            </option>

                            <option value="3rd">
                                3rd Semester
                            </option>

                            <option value="4th">
                                4th Semester
                            </option>

                            <option value="5th">
                                5th Semester
                            </option>

                            <option value="6th">
                                6th Semester
                            </option>

                            <option value="7th">
                                7th Semester
                            </option>

                            <option value="8th">
                                8th Semester
                            </option>

                        </select>

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Target Department
                        </label>

                        <input
                            type="text"
                            name="target_department"
                            class="form-control"
                            placeholder="Leave empty for all departments"
                        >

                    </div>


                    <!-- IMAGE -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Notice Photo / Letter
                        </label>

                        <input
                            type="file"
                            name="image"
                            class="form-control"
                            accept=".jpg,.jpeg,.png,.webp"
                        >

                        <small class="text-muted">
                            JPG, JPEG, PNG or WEBP
                        </small>

                    </div>


                    <!-- PDF -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Official Notice PDF
                        </label>

                        <input
                            type="file"
                            name="pdf_file"
                            class="form-control"
                            accept=".pdf"
                        >

                        <small class="text-muted">
                            PDF file only
                        </small>

                    </div>


                    <!-- PUBLISH -->

                    <div class="col-12">

                        <div class="form-check form-switch">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_published"
                                id="is_published"
                                checked
                            >

                            <label
                                class="form-check-label fw-semibold"
                                for="is_published"
                            >
                                Publish this notice immediately
                            </label>

                        </div>

                    </div>


                    <!-- BUTTONS -->

                    <div class="col-12">

                        <hr>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary px-4"
                            >
                                <i class="bi bi-check-circle me-1"></i>
                                Publish Notice
                            </button>

                            <a
                                href="{{ url_for('admin_notice.index') }}"
                                class="btn btn-light"
                            >
                                Cancel
                            </a>

                        </div>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
