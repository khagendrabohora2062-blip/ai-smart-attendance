<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Registration</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            text-align:center;
            padding:50px;
        }

        .box{
            width:700px;
            margin:auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            color:#0d6efd;
        }

        button{
            padding:12px 25px;
            font-size:16px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#0b5ed7;
        }
    </style>

</head>
<body>

<div class="box">

    <h2>Face Registration Module</h2>

    <p>AI Smart Attendance System</p>

    <button>
        Start Face Registration
    </button>

</div>

</body>
</html>
