{% extends 'layouts/base.html' %}

{% block title %}
Add New Teacher
{% endblock %}


{% block content %}


<div class="container-fluid">


<div class="row justify-content-center">


<div class="col-lg-8">


<div class="card shadow">


<div class="card-header bg-primary text-white">


<h4 class="mb-0">

<i class="bi bi-person-plus-fill"></i>

Add New Teacher

</h4>


</div>





<div class="card-body">


<form 
method="POST"
enctype="multipart/form-data">





<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

Teacher ID

</label>


<input

type="text"

name="teacher_id"

class="form-control"

placeholder="T001"

required>


</div>





<div class="col-md-6 mb-3">


<label class="form-label">

Full Name

</label>


<input

type="text"

name="full_name"

class="form-control"

placeholder="Enter Full Name"

required>


</div>



</div>







<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

Email

</label>


<input

type="email"

name="email"

class="form-control"

placeholder="Enter Email"

required>


</div>





<div class="col-md-6 mb-3">


<label class="form-label">

Phone

</label>


<input

type="text"

name="phone"

class="form-control"

placeholder="Enter Phone Number">


</div>



</div>








<div class="mb-3">


<label class="form-label">

Department

</label>


<input

type="text"

name="department"

class="form-control"

placeholder="Computer Engineering"

required>


</div>








<!-- Teacher Photo -->


<div class="mb-3">


<label class="form-label">


<i class="bi bi-image"></i>

Teacher Photo


</label>



<input

type="file"

name="photo"

class="form-control"

accept=".jpg,.jpeg,.png"

onchange="previewImage(event)">



<small class="text-muted">

JPG, JPEG or PNG only

</small>



</div>






<!-- Preview -->


<div class="text-center mb-3">


<img

id="preview"

src=""

class="rounded-circle shadow"

width="120"

height="120"

style="display:none; object-fit:cover;">



</div>









<button

type="submit"

class="btn btn-success">


<i class="bi bi-check-circle"></i>


Save Teacher


</button>





<a

href="{{ url_for('teachers.index') }}"

class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>


Back


</a>





</form>



</div>


</div>


</div>


</div>


</div>






<script>


function previewImage(event){


let image =
document.getElementById(
"preview"
);


let file =
event.target.files[0];



if(file){


image.style.display="block";


image.src =
URL.createObjectURL(file);


}


}



</script>



{% endblock %}
