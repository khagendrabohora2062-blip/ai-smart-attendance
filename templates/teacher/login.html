{% extends "layouts/base.html" %}

{% block title %}
Teacher Login | AI Smart Attendance
{% endblock %}

{% block content_public %}

<style>
/* =========================================================
   TEACHER LOGIN PAGE
   Clean • Professional • Responsive
========================================================= */

.teacher-login-page {
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(13, 110, 253, 0.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(111, 66, 193, 0.12),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #f7f9fc 0%,
            #eef3f9 100%
        );
    box-sizing: border-box;
}

.teacher-login-page *,
.teacher-login-page *::before,
.teacher-login-page *::after {
    box-sizing: border-box;
}

/* ================= CARD ================= */

.teacher-login-card {
    width: 100%;
    max-width: 440px;
    background: rgba(255,255,255,0.96);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 24px;
    padding: 38px 36px 30px;
    box-shadow:
        0 25px 70px rgba(15, 23, 42, 0.12),
        0 5px 20px rgba(15, 23, 42, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

/* ================= TOP ICON ================= */

.teacher-login-icon {
    width: 76px;
    height: 76px;
    margin: 0 auto 20px;
    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #0d6efd,
            #6f42c1
        );

    color: #ffffff;
    font-size: 31px;

    box-shadow:
        0 14px 32px rgba(13,110,253,0.24);
}

/* ================= HEADER ================= */

.teacher-login-header {
    text-align: center;
    margin-bottom: 30px;
}

.teacher-login-header h2 {
    margin: 0;
    color: #172033;
    font-size: 27px;
    font-weight: 750;
    letter-spacing: -0.4px;
}

.teacher-login-header p {
    margin: 8px 0 0;
    color: #718096;
    font-size: 14px;
    line-height: 1.5;
}

/* ================= FORM ================= */

.teacher-form-group {
    margin-bottom: 20px;
}

.teacher-form-label {
    display: block;
    margin-bottom: 8px;
    color: #344054;
    font-size: 13px;
    font-weight: 650;
}

/* ================= INPUT ================= */

.teacher-input-wrapper {
    position: relative;
    width: 100%;
}

.teacher-input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);

    color: #98a2b3;
    font-size: 17px;

    pointer-events: none;
    z-index: 2;
}

.teacher-form-control {
    width: 100%;
    height: 52px;

    padding: 0 46px 0 45px;

    border: 1px solid #dfe4ea;
    border-radius: 13px;

    outline: none;

    background: #ffffff;
    color: #1d2939;

    font-size: 14px;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.teacher-form-control::placeholder {
    color: #a0a9b5;
}

.teacher-form-control:hover {
    border-color: #c9d1dc;
}

.teacher-form-control:focus {
    border-color: #0d6efd;
    background: #ffffff;

    box-shadow:
        0 0 0 4px rgba(13,110,253,0.10);
}

/* ================= PASSWORD ================= */

.teacher-password-input {
    padding-right: 52px;
}

.teacher-password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);

    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 8px;

    background: transparent;
    color: #7b8794;

    cursor: pointer;

    font-size: 17px;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

.teacher-password-toggle:hover {
    background: #f0f4f8;
    color: #0d6efd;
}

/* ================= LOGIN BUTTON ================= */

.teacher-login-button {
    width: 100%;
    height: 52px;

    margin-top: 4px;

    border: none;
    border-radius: 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #0d6efd,
            #6f42c1
        );

    color: #ffffff;

    font-size: 14px;
    font-weight: 650;

    cursor: pointer;

    box-shadow:
        0 10px 24px rgba(13,110,253,0.20);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.teacher-login-button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 14px 30px rgba(13,110,253,0.28);
}

.teacher-login-button:active {
    transform: translateY(0);
}

/* ================= BACK TO HOME ================= */

.teacher-back-home {
    margin-top: 22px;
    text-align: center;
}

.teacher-back-home a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    color: #667085;
    text-decoration: none;

    font-size: 13px;
    font-weight: 600;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.teacher-back-home a:hover {
    color: #0d6efd;
    transform: translateX(-2px);
}

/* ================= FOOTER ================= */

.teacher-login-footer {
    margin-top: 24px;
    padding-top: 19px;

    border-top: 1px solid #edf0f4;

    text-align: center;
}

.teacher-login-footer p {
    margin: 0;

    color: #98a2b3;
    font-size: 11px;
}

/* ================= MOBILE ================= */

@media (max-width: 576px) {

    .teacher-login-page {
        padding: 20px 14px;
        align-items: center;
    }

    .teacher-login-card {
        max-width: 100%;
        padding: 30px 22px 25px;
        border-radius: 20px;
    }

    .teacher-login-icon {
        width: 68px;
        height: 68px;
        margin-bottom: 17px;
        border-radius: 19px;
        font-size: 27px;
    }

    .teacher-login-header {
        margin-bottom: 25px;
    }

    .teacher-login-header h2 {
        font-size: 24px;
    }

    .teacher-login-header p {
        font-size: 13px;
    }

    .teacher-form-group {
        margin-bottom: 17px;
    }

    .teacher-form-control,
    .teacher-login-button {
        height: 50px;
    }
}

/* ================= VERY SMALL MOBILE ================= */

@media (max-width: 360px) {

    .teacher-login-page {
        padding: 15px 10px;
    }

    .teacher-login-card {
        padding: 25px 17px 22px;
    }

    .teacher-login-icon {
        width: 62px;
        height: 62px;
        font-size: 25px;
    }

    .teacher-login-header h2 {
        font-size: 22px;
    }

    .teacher-login-header p {
        font-size: 12px;
    }
}

/* ================= REDUCED MOTION ================= */

@media (prefers-reduced-motion: reduce) {
    .teacher-login-button,
    .teacher-back-home a,
    .teacher-password-toggle,
    .teacher-form-control {
        transition: none !important;
    }
}
</style>


<div class="teacher-login-page">

    <div class="teacher-login-card">

        <!-- ==============================
             ICON
        =============================== -->

        <div class="teacher-login-icon">
            <i class="bi bi-person-workspace"></i>
        </div>


        <!-- ==============================
             HEADER
        =============================== -->

        <div class="teacher-login-header">

            <h2>
                Teacher Login
            </h2>

            <p>
                Sign in to access your teacher dashboard
            </p>

        </div>


        <!-- ==============================
             LOGIN FORM
        =============================== -->

        <form
            method="POST"
            action="{{ url_for('teacher_auth.login') }}"
            autocomplete="off"
        >

            <!-- EMAIL -->

            <div class="teacher-form-group">

                <label
                    for="teacher-email"
                    class="teacher-form-label"
                >
                    Email Address
                </label>

                <div class="teacher-input-wrapper">

                    <i
                        class="bi bi-envelope teacher-input-icon"
                    ></i>

                    <input
                        type="email"
                        id="teacher-email"
                        name="email"
                        class="teacher-form-control"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="teacher-form-group">

                <label
                    for="teacher-password"
                    class="teacher-form-label"
                >
                    Password
                </label>

                <div class="teacher-input-wrapper">

                    <i
                        class="bi bi-lock teacher-input-icon"
                    ></i>

                    <input
                        type="password"
                        id="teacher-password"
                        name="password"
                        class="teacher-form-control teacher-password-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="teacher-password-toggle"
                        id="teacherPasswordToggle"
                        aria-label="Show password"
                    >
                        <i
                            class="bi bi-eye"
                            id="teacherPasswordIcon"
                        ></i>
                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="teacher-login-button"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login as Teacher
            </button>

        </form>


        <!-- ==============================
             BACK TO HOME
        =============================== -->

        <div class="teacher-back-home">

            <a href="{{ url_for('home.index') }}">

                <i class="bi bi-arrow-left"></i>

                Back to Home

            </a>

        </div>


        <!-- ==============================
             FOOTER
        =============================== -->

        <div class="teacher-login-footer">

            <p>
                AI Smart Attendance System
            </p>

        </div>

    </div>

</div>


<!-- =========================================================
     PASSWORD TOGGLE
========================================================= -->

<script>
(function () {

    const passwordInput =
        document.getElementById("teacher-password");

    const toggleButton =
        document.getElementById("teacherPasswordToggle");

    const icon =
        document.getElementById("teacherPasswordIcon");


    if (
        !passwordInput ||
        !toggleButton ||
        !icon
    ) {
        return;
    }


    toggleButton.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type === "password";


            if (isPassword) {

                passwordInput.type = "text";

                icon.classList.remove("bi-eye");

                icon.classList.add("bi-eye-slash");

                toggleButton.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type = "password";

                icon.classList.remove("bi-eye-slash");

                icon.classList.add("bi-eye");

                toggleButton.setAttribute(
                    "aria-label",
                    "Show password"
                );
            }

        }
    );

})();
</script>

{% endblock %}
