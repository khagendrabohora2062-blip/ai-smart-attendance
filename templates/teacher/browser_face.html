
{% extends "layouts/base.html" %}

{% block title %}
Face Attendance
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row g-4">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="bi bi-camera-video-fill me-2"></i>
                        Face Attendance
                    </h4>

                </div>

                <div class="card-body text-center">

                    <div class="camera-wrapper">

                        <video
                            id="video"
                            autoplay
                            muted
                            playsinline>
                        </video>

                        <div
                            id="cameraMessage"
                            class="camera-message">

                            Click "Start Camera"

                        </div>

                    </div>

                    <canvas id="canvas"></canvas>

                    <div class="mt-4">

                        <button
                            type="button"
                            id="startBtn"
                            class="btn btn-success me-2">

                            <i class="bi bi-camera-fill me-1"></i>
                            Start Camera

                        </button>

                        <button
                            type="button"
                            id="stopBtn"
                            class="btn btn-danger">

                            <i class="bi bi-stop-fill me-1"></i>
                            Stop Camera

                        </button>

                    </div>

                    <div
                        id="cameraError"
                        class="alert alert-danger mt-3 d-none">
                    </div>

                </div>

            </div>

        </div>


        <div class="col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-dark text-white">
                    Live Attendance
                </div>

                <div class="card-body">

                    <h5 id="studentName">
                        Waiting...
                    </h5>

                    <p class="mb-2">

                        Student ID:

                        <strong id="studentId">
                            -
                        </strong>

                    </p>

                    <hr>

                    <p>
                        Status:
                        <span
                            id="status"
                            class="badge bg-secondary">
                            Camera Off
                        </span>
                    </p>

                    <p>
                        Confidence:
                        <span id="confidence">
                            0%
                        </span>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>


<style>

.camera-wrapper {
    position: relative;
    width: 100%;
    max-width: 760px;
    margin: auto;
    background: #111827;
    border-radius: 12px;
    overflow: hidden;
}

#video {
    width: 100%;
    height: auto;
    min-height: 420px;
    object-fit: cover;
    display: block;
    background: #111827;
}

#canvas {
    display: none;
}

.camera-message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    background: rgba(0,0,0,0.35);
    pointer-events: none;
}

@media (max-width: 768px) {

    #video {
        min-height: 300px;
    }

}

</style>


<script>
const sessionId = {{ session_id|tojson }};
</script>

<script src="{{ url_for('static', filename='js/browser_face.js') }}"></script>

{% endblock %}
